<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Google Calendar Assistant workflow</title><desc id="desc">A Streamlit scheduling assistant interprets user intent, authenticates with Google Calendar, confirms supported changes, and reports the result.</desc><rect width="1200" height="400" rx="18" fill="#F2F5F0"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#458363">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#29392F">Google Calendar Assistant</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6B786E">A natural-language request to a calendar event</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D7E0D7"/><path d="M 300 237 L 330 237" stroke="#6B786E" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#6B786E" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#6B786E" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#6B786E" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#6B786E" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#6B786E" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7E0D7" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#458363"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#458363">01 / REQUEST</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#29392F">Describe a change</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B786E">Ask to list, create, or delete events.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7E0D7" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#4E79A7"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4E79A7">02 / AGENT</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#29392F">Interpret intent</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B786E">Resolve event details and time.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7E0D7" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#B08B45"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#B08B45">03 / AUTH</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#29392F">Google OAuth2</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B786E">Use an authorised calendar connection.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D7E0D7" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#458363"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#458363">04 / CALENDAR</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#29392F">Confirm and update</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B786E">Perform the supported action.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#458363">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B786E">Confirm date, time zone, and target event before changing a real calendar.</text></svg>